# RAGEve Docker Compose - Production-Ready Configuration
# Uses Ubuntu 24.04 base with proper resource limits and security

services:
  # MySQL Database (27-table RAGEve schema)
  mysql:
    image: mysql:9.6
    container_name: rageve-mysql
    env_file:
      - path: .env
        required: true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rag_eve}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-rag_eve}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=900
      - --innodb-buffer-pool-size=1G
      - --innodb_redo_log_capacity=1G
      - --max-allowed-packet=1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rag_eve}"]
      interval: 10s
      timeout: 5sf  
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rageve-qdrant
    env_file:
      - path: .env
        required: false
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q ':18BD ' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: rageve-minio
    command: server /data --console-address ":9001"
    env_file:
      - path: .env
        required: true
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_eve}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-rag_eve}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rageve-redis
    env_file:
      - path: .env
        required: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rag_eve}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-rag_eve}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --dbfilename dump.rdb
      --dir /data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # Backend API (FastAPI)
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
    container_name: rageve-backend
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/app/data
    env_file:
      - path: .env
        required: true
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      RAGEVE_CONFIG_PATH: /app/conf/service_conf.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rageve
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health', timeout=3); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  # Frontend (Next.js) - Served via nginx (static files only)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: rageve-frontend
    # Frontend serves on port 3000 (Next.js standalone), nginx will proxy to this
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rageve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy (Entry Point)
  nginx:
    image: nginx:alpine
    container_name: rageve-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      # Uncomment for HTTPS (requires TLS certificates)
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount TLS certificates for HTTPS (optional)
      # - ../ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rageve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
  redis_data:
  backend_data:

networks:
  rageve:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
