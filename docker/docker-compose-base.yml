# RAGEve Docker Compose - Production-Ready Configuration
# Uses Ubuntu 24.04 base with proper resource limits and security

services:
  # MySQL Database (27-table RAGEve schema)
  mysql:
    image: mysql:9.6
    container_name: rageve-mysql
    env_file:
      - path: .env
        required: true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DBNAME}
      MYSQL_PORT: ${MYSQL_PORT}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=900
      - --innodb-buffer-pool-size=1G
      - --innodb_redo_log_capacity=1G
      - --max-allowed-packet=1G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rageve-qdrant
    env_file:
      - path: .env
        required: false
    ports:
      - "${QDRANT_PORT}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q ':18BD ' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: rageve-minio
    command: server /data --console-address ":9001"
    env_file:
      - path: .env
        required: true
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rageve-redis
    env_file:
      - path: .env
        required: true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --stop-writes-on-bgsave-error yes
      --rdbcompression yes
      --dbfilename dump.rdb
      --dir /data
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rageve
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
  redis_data:

networks:
  rageve:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
