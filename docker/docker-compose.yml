# RAGEve Production Compose Override
#
# This file includes the base configuration and applies production-specific overrides.
# It is designed to be used with: docker compose -f docker/docker-compose.yml up -d
#
# For development without production overrides:
#   docker compose -f docker/docker-compose-base.yml up -d

include:
  - ./docker-compose-base.yml

services:
  # Override backend for production
  backend:
    restart: always
    # In production, access via nginx reverse proxy only - disable direct port
    ports: []
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'

  # Override frontend for production
  frontend:
    restart: always
    # In production, access via nginx only - disable direct port
    ports: []
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Override MySQL for production
  mysql:
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=900
      - --innodb-buffer-pool-size=4G  # Increased for production workload
      - --innodb_redo_log_capacity=1G
      - --max-allowed-packet=1G
      - --slow-query-log=1  # Enable slow query logging
      - --slow-query-log-file=/var/log/mysql/mysql-slow.log
      - --long-query-time=2
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  # Override Qdrant for production
  qdrant:
    restart: always
    environment:
      QDRANT__SERVICE__OPTIMIZATION: performance
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  # Override Redis for production
  redis:
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 300 1
      --save 60 100
      --stop-writes-on-bgsave-error yes
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Override nginx for production
  nginx:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
