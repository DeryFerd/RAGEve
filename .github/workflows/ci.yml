name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 'rootpassword'
          MYSQL_DATABASE: rag_eve_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=15s
          --health-timeout=30s
          --health-retries=10
        ports:
          - 3306:3306
      qdrant:
        image: qdrant/qdrant:latest
        options: >-
          --health-cmd="curl -f http://localhost:6333/health || exit 1"
          --health-interval=15s
          --health-timeout=120s
          --health-retries=20
          --health-start-period=120s
        ports:
          - 6333:6333
      ollama:
        image: ollama/ollama:latest
        options: >-
          --health-cmd="curl -f http://localhost:11434/api/version || exit 1"
          --health-interval=15s
          --health-timeout=120s
          --health-retries=20
          --health-start-period=120s
        ports:
          - 11434:11434

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen

      - name: Wait for services
        run: |
          sleep 120

      - name: Initialize database schema
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: 'rootpassword'
          MYSQL_DBNAME: rag_eve_test
          OLLAMA_BASE_URL: http://localhost:11434
          QDRANT_URL: http://localhost:6333
        run: |
          uv run python -c "from backend.models_peewee import init_db; init_db()"

      - name: Run store unit tests
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: 'rootpassword'
          MYSQL_DBNAME: rag_eve_test
          OLLAMA_BASE_URL: http://localhost:11434
          QDRANT_URL: http://localhost:6333
        run: uv run python test/test_stores.py

      - name: Run API integration tests
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: 'rootpassword'
          MYSQL_DBNAME: rag_eve_test
          OLLAMA_BASE_URL: http://localhost:11434
          QDRANT_URL: http://localhost:6333
        run: uv run python -m pytest test/api/ -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-backend
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint || echo "No lint script configured"

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --passWithNoTests || echo "No tests configured"

  test-combined:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check combined status
        run: |
          echo "All tests completed"
        if: success()
